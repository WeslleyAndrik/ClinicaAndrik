version: '3.8'

services:
  # Servidor de Aplicação (PHP 7.2.5-FPM)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: clinica_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=clinica_medica
      - DB_USERNAME=clinica_user
      - DB_PASSWORD=clinica_senha_forte
    networks:
      - clinica-network
    depends_on:
      - db

  # Servidor Web (Nginx)
  web:
    image: nginx:alpine
    container_name: clinica_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - clinica-network
    depends_on:
      - app

  # Banco de Dados Relacional (MySQL 5.7 compatível com PHP 7.2)
  db:
    image: mysql:5.7
    container_name: clinica_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: clinica_medica
      MYSQL_ROOT_PASSWORD: root_super_secret
      MYSQL_USER: clinica_user
      MYSQL_PASSWORD: clinica_senha_forte
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - clinica-network

  # Gerenciador de Banco de Dados Web (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: clinica_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: clinica_user
      PMA_PASSWORD: clinica_senha_forte
      UPLOAD_LIMIT: 40M
    networks:
      - clinica-network
    depends_on:
      - db

networks:
  clinica-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
